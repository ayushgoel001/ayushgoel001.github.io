<style>
:root {
--bg: #0b0d12;
--card-bg: rgba(255, 255, 255, 0.03);
--border: rgba(255, 255, 255, 0.08);
--accent: #2fb3ff;
--accent-glow: rgba(47, 179, 255, 0.3);
--text: #e6eef6;
--muted: #9fb0c3;
--maxw: 1200px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
margin: 0;
background: var(--bg);
color: var(--text);
font-family: 'Inter', -apple-system, sans-serif;
line-height: 1.6;
-webkit-font-smoothing: antialiased;
}
.wrap {
max-width: var(--maxw);
margin: 40px auto;
padding: 0 28px;
display: grid;
grid-template-columns: 320px 1fr;
gap: 40px;
}

/* --- Left Sidebar --- */
.left {
position: sticky;
top: 40px;
height: fit-content;
display: flex;
flex-direction: column;
gap: 20px;
}
.avatar {
width: 180px;
height: 180px;
border-radius: 20px;
overflow: hidden;
border: 1px solid var(--border);
box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}
.avatar img {
width: 100%;
height: 100%;
object-fit: cover;
}
.identity h1 {
font-size: 28px;
margin: 0;
color: var(--accent);
letter-spacing: -0.5px;
}
.identity .tagline {
font-size: 15px;
color: var(--muted);
margin-top: 4px;
font-weight: 500;
}
.stats {
background: var(--card-bg);
border: 1px solid var(--border);
padding: 15px;
border-radius: 12px;
font-size: 13px;
}
.stat-item {
display: flex;
justify-content: space-between;
margin-bottom: 8px;
}
.stat-item:last-child { margin-bottom: 0; }
.stat-label { color: var(--muted); }
.stat-value { color: var(--text); font-weight: 600; }

.nav-menu {
display: flex;
flex-direction: column;
gap: 8px;
margin-top: 10px;
}
.nav-menu a {
color: var(--muted);
text-decoration: none;
font-size: 14px;
padding: 8px 12px;
border-radius: 8px;
transition: 0.2s;
border: 1px solid transparent;
}
.nav-menu a:hover {
color: var(--accent);
background: var(--card-bg);
border-color: var(--border);
}

.social-links {
display: flex;
gap: 12px;
margin-top: 10px;
}
.social-btn {
flex: 1;
padding: 10px;
border-radius: 8px;
background: var(--card-bg);
border: 1px solid var(--border);
text-align: center;
transition: 0.2s;
}
.social-btn:hover {
border-color: var(--accent);
background: rgba(47, 179, 255, 0.05);
}

/* Resume Button */
.resume-btn {
margin-top: 12px;
padding: 12px;
text-align: center;
font-size: 14px;
font-weight: 600;
border-radius: 10px;
background: linear-gradient(135deg, #2fb3ff, #1d8ed8);
color: #02131f;
text-decoration: none;
transition: 0.25s;
box-shadow: 0 10px 25px rgba(47,179,255,0.25);
}
.resume-btn:hover {
transform: translateY(-2px);
box-shadow: 0 15px 35px rgba(47,179,255,0.35);
}

/* --- Main Content --- */
.section { margin-bottom: 50px; }
h2.section-title {
font-size: 14px;
text-transform: uppercase;
letter-spacing: 2px;
color: var(--accent);
margin-bottom: 24px;
display: flex;
align-items: center;
gap: 15px;
}
h2.section-title::after {
content: "";
height: 1px;
flex-grow: 1;
background: var(--border);
}
.about-text {
font-size: 16px;
color: var(--muted);
max-width: 70ch;
}
.about-text strong { color: var(--text); }

.card {
background: var(--card-bg);
border: 1px solid var(--border);
padding: 24px;
border-radius: 16px;
margin-bottom: 20px;
transition: 0.3s;
}
.card:hover {
border-color: rgba(47, 179, 255, 0.4);
transform: translateY(-2px);
}

.tech-stack {
display: flex;
flex-wrap: wrap;
gap: 8px;
margin-top: 16px;
}
.tag {
font-family: 'Fira Code', monospace;
font-size: 11px;
color: var(--accent);
background: rgba(47,179,255,0.1);
padding: 4px 10px;
border-radius: 4px;
}

.projects-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 20px;
}

footer {
padding: 40px 0;
text-align: center;
font-size: 13px;
color: var(--muted);
border-top: 1px solid var(--border);
margin-top: 40px;
}

@media (max-width: 900px) {
.wrap { grid-template-columns: 1fr; }
.left { position: relative; top: 0; align-items: center; text-align: center; }
.projects-grid { grid-template-columns: 1fr; }
}
</style>
</head>
